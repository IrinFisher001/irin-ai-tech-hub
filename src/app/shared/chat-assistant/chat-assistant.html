<button
  class="chat-button"
  (click)="toggleChat()">

  💬 Ask IRIN AI

</button>

@if (isOpen) {

<div class="chat-window">

  <div class="chat-header">
    Ask IRIN AI
  </div>

  <div class="chat-body">

    @for (message of messages; track $index) {

      <div class="message" [class.user]="message.from === 'user'" [class.ai]="message.from === 'ai'">

        <p>{{ message.text }}</p>

        @for (link of message.links ?? []; track link.route) {

          <a [routerLink]="link.route">
            {{ link.label }}
          </a>

        }

      </div>

    }

  </div>

  <div class="chat-suggestions">

    @for (suggestion of suggestions; track suggestion) {

      <button
        type="button"
        class="suggestion-chip"
        (click)="send(suggestion)">

        {{ suggestion }}

      </button>

    }

  </div>

  <div class="chat-footer">

    <input
      type="text"
      [(ngModel)]="input"
      (keyup.enter)="send()"
      placeholder="Type your question..." />

    <button
      type="button"
      (click)="send()">

      Send

    </button>

  </div>

</div>

}
